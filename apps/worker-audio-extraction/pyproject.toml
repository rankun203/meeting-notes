[project]
name = "worker-audio-extraction"
version = "0.1.0"
description = "Local CPU/GPU and RunPod audio transcription + diarization worker"
requires-python = ">=3.10"
dependencies = [
    "whisperx>=3.8.6,<3.9",
    "opencc>=1.2.0",
    "runpod>=1.7.0",
    "requests>=2.31.0",
]

# WhisperX declares its torch ABI dependencies. Dockerfiles constrain the GPU base
# image versions or explicitly install matching CPU wheels before application dependencies.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_extraction"]

[dependency-groups]
transfer-test = ["requests>=2.31.0"]
