name: meeting-notes
services:
  server:
    image: meeting-notes-server:local
    build: ./apps/server
    ports:
      - '127.0.0.1:${SERVER_PORT:-3033}:3000'
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      SERVER_URL: ${SERVER_URL:-http://localhost:3033}
      SERVER_INTERNAL_URL: http://server:3000
      DATA_DIR: /app/data
      DATABASE_ADAPTER: sqlite
      DATABASE_URI: file:/app/data/gday.db
      TRANSCRIPTION_PROVIDER: local
      LOCAL_WORKER_URL: http://worker-audio-extraction:8000
      LOCAL_WORKER_API_TOKEN: ${LOCAL_WORKER_API_TOKEN:?Set LOCAL_WORKER_API_TOKEN in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-500000000}
    volumes:
      - server-data:/app/data
    depends_on:
      worker-audio-extraction:
        condition: service_started
    restart: unless-stopped
  worker-audio-extraction:
    image: meeting-notes-worker-audio-extraction:cpu-local
    build:
      context: ./apps/worker-audio-extraction
      dockerfile: Dockerfile.cpu
    environment:
      WORKER_MODE: http
      WORKER_API_TOKEN: ${LOCAL_WORKER_API_TOKEN:?Set LOCAL_WORKER_API_TOKEN in .env}
      WORKER_DATA_DIR: /data
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      - worker-data:/data
      - worker-cache:/cache
    restart: unless-stopped
volumes:
  server-data:
    name: ${SERVER_DATA_VOLUME:-gday-meetings-data}
  worker-data:
  worker-cache:
